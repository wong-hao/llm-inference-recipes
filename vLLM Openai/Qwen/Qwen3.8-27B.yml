services:
  qwen3-8-27b-vllm:
    image: vllm/vllm-openai:latest
    container_name: qwen3-8-27b-vllm

    restart: always

    # 暴露端口
    ports:
      - "8000:8000"

    # 环境变量：对应原命令开头的 SAFETENSORS_FAST_GPU=1
    environment:
      - SAFETENSORS_FAST_GPU=1
      - NVIDIA_VISIBLE_DEVICES=all

    # 挂载模型和缓存
    volumes:
      # 确保本地存在 models 文件夹
      - /home/huggingface/hf_model:/models
      - /home/huggingface/hf_cache:/root/.cache/huggingface

    # 共享内存：vLLM 多卡通信需要较大的共享内存
    shm_size: 64g

    # 文件描述符限制
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    # 资源限制：建议移除 mem_limit 或设置为更高值，80g 对于推理可能过小
    # mem_limit: 200g 

    # 安全限制：允许所有系统调用
    security_opt:
      - seccomp=unconfined

    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids: ['0', '1', '2', '3', '4', '5', '6', '7']
            capabilities: [gpu]


    command: >
      /models/Qwen/Qwen3.8-27B
      --trust-remote-code
      --tensor-parallel-size 8
      --enable-chunked-prefill
      --enable-prefix-caching
      --async-scheduling
      --max-model-len 262144
      --gpu-memory-utilization 0.92
      --mm-encoder-tp-mode data
      --reasoning-parser qwen3
      --served-model-name qwen3.8-27b
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
      --api-key sk-cdutwxc2026qwen
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --host 0.0.0.0
      --port 8000